[package]
name = "gpui-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
dirs = "7"
gpui = { version = "0.2.2", default-features = false }
ipnet = { version = "2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "http2", "native-tls", "socks", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }
tempfile = "3"
url = "2"
uuid = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100.0"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }
